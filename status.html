<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헌혈나눔 - 혈액 현황</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/status.js" defer></script>
</head>
<body data-page="status">

<main class="page">
  <div class="content">

    <section id="stock">
      <h2>혈액형별 보유량 <span class="sample-tag">예시</span></h2>
      <div class="notice" style="margin-bottom:1.2rem">
        <strong>예시 데이터</strong> · 아래 수치는 화면 구성을 위한 임의의 값이에요. 실제 보유 현황은 <a href="#official">공식 사이트</a>에서 확인하세요.
        단계 기준(여유·보통·부족·긴급)도 이 사이트가 임의로 정한 값이에요.
      </div>
      <div class="mytype-row">
        <label for="my-type">내 혈액형</label>
        <select id="my-type">
          <option value="">선택 안 함</option>
          <option value="A">A형</option>
          <option value="B">B형</option>
          <option value="O">O형</option>
          <option value="AB">AB형</option>
        </select>
        <span id="my-type-msg"></span>
      </div>
      <div id="stock-dash" class="dash"></div>
      <div class="legend" aria-label="단계 기준">
        <span style="--c:var(--lv1)">여유 · 5일분 이상</span>
        <span style="--c:var(--lv2)">보통 · 3~5일분</span>
        <span style="--c:var(--lv3)">부족 · 2~3일분</span>
        <span style="--c:var(--lv4)">긴급 · 2일분 미만</span>
      </div>
    </section>

    <section id="official">
      <h2>공식 현황 보기</h2>
      <div class="ref-site-list">
        <a class="ref-site-card" href="https://www.bloodinfo.net" target="_blank" rel="noopener">
          <div class="ref-site-name">혈액정보 (대한적십자사 혈액관리본부)</div>
          <div class="ref-site-desc">혈액형별 실시간 보유 현황과 헌혈 안내를 제공하는 공식 사이트.</div>
        </a>
      </div>
    </section>

  </div>
</main>

</body>
</html>
