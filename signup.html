<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헌혈나눔 - 회원가입</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/signup.js" defer></script>
</head>
<body data-page="signup">

<main class="page">
  <div class="content">

    <section class="auth-section">
      <h2>회원가입</h2>
      <form id="signup-form" novalidate>
        <div class="form-grid">
          <div class="field full">
            <label for="su-email">이메일</label>
            <input id="su-email" type="email" autocomplete="email" placeholder="example@email.com">
          </div>
          <div class="field">
            <label for="su-nick">닉네임 (2~12자)</label>
            <input id="su-nick" type="text" maxlength="12" autocomplete="nickname" placeholder="예: 정기헌혈러">
          </div>
          <div class="field">
            <label for="su-blood">혈액형 (선택)</label>
            <select id="su-blood">
              <option value="">선택 안 함</option>
              <option value="A">A형</option>
              <option value="B">B형</option>
              <option value="O">O형</option>
              <option value="AB">AB형</option>
            </select>
          </div>
          <div class="field">
            <label for="su-pw">비밀번호 (8자 이상)</label>
            <input id="su-pw" type="password" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="su-pw2">비밀번호 확인</label>
            <input id="su-pw2" type="password" autocomplete="new-password">
          </div>
        </div>
        <div class="form-actions"><button type="submit" class="btn" id="su-submit">가입하기</button></div>
        <p id="su-msg" class="form-msg error" role="alert"></p>
        <p class="hint">이메일은 로그인과 인증 메일 발송에만 사용돼요.</p>
      </form>
      <p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p>
    </section>

  </div>
</main>

</body>
</html>
